---
description: Pipeline for GCP IAM, Cloud Identity, and Workload Identity Authentication events
processors:
  # Drop non-JSON messages
  - drop:
      when:
        not:
          starts_with:
            raw: "{"
  - json:
      field: raw
  - drop:
      when:
        not:
          has_fields: ["raw.protoPayload"]

  # Base envelope constants
  - set:
      field: vendor
      value: GCP
  - set:
      field: product
      value: "Google Cloud Platform"
  - set:
      field: cloud.provider
      value: gcp
  - set:
      field: type
      value: event
  - set:
      field: event.kind
      value: event
  - set:
      field: event.module
      value: gcp_audit
  - set:
      field: event.dataset
      value: gcp.identity_auth

  # Timestamp mapping
  - date:
      field: raw.timestamp
      target_field: "@timestamp"
      timezone: UTC
      formats:
        - ISO8601
      ignore_failure: true
      ignore_missing: true

  # Resource and project attributes
  - copy:
      field: raw.resource.labels.project_id
      target_field: cloud.project.id
      ignore_missing: true
  - copy:
      field: raw.protoPayload.serviceName
      target_field: service.name
      ignore_missing: true
  - copy:
      field: raw.protoPayload.methodName
      target_field: event.action
      ignore_missing: true
  - copy:
      field: raw.protoPayload.resourceName
      target_field: gcp.audit.resource_name
      ignore_missing: true

  # Caller metadata (IP, user agent)
  - copy:
      field: raw.protoPayload.requestMetadata.callerIp
      target_field: source.ip
      ignore_missing: true
  - copy:
      field: raw.protoPayload.requestMetadata.callerSuppliedUserAgent
      target_field: user_agent.original
      ignore_missing: true

  # Principal identity extraction
  - copy:
      field: raw.protoPayload.authenticationInfo.principalEmail
      target_field: user.email
      ignore_missing: true
  - copy:
      field: raw.protoPayload.authenticationInfo.principalEmail
      target_field: user.name
      ignore_missing: true

  # Service Account Key extraction (Static Key detection)
  - copy:
      field: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      target_field: gcp.iam.service_account_key_name
      ignore_missing: true
  - set:
      field: gcp.iam.auth_mechanism
      value: static_service_account_key
      when:
        has_fields: ["raw.protoPayload.authenticationInfo.serviceAccountKeyName"]

  # Workload Identity Federation (WIF) extraction
  - copy:
      field: raw.protoPayload.authenticationInfo.principalSubject
      target_field: gcp.iam.principal_subject
      ignore_missing: true
  - set:
      field: gcp.iam.auth_mechanism
      value: workload_identity_federation
      when:
        has_fields: ["raw.protoPayload.authenticationInfo.principalSubject"]

  # Service Account Delegation / Impersonation chain
  - copy:
      field: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      target_field: gcp.iam.delegation_chain
      ignore_missing: true

  # Status / Outcome
  - set:
      field: event.outcome
      value: success
      when:
        or:
          - not:
              has_fields: ["raw.protoPayload.status.code"]
          - equals:
              raw.protoPayload.status.code: 0
  - set:
      field: event.outcome
      value: failure
      when:
        and:
          - has_fields: ["raw.protoPayload.status.code"]
          - not:
              equals:
                raw.protoPayload.status.code: 0

  # Specific Authentication Event Categorization
  # 1. Google Workspace / Cloud Identity Logins
  - set:
      field: event.category
      value: [authentication]
      when:
        equals:
          raw.protoPayload.serviceName: "login.googleapis.com"
  - set:
      field: event.type
      value: [start]
      when:
        equals:
          raw.protoPayload.serviceName: "login.googleapis.com"
  - set:
      field: event.outcome
      value: success
      when:
        equals:
          raw.protoPayload.methodName: "google.login.LoginService.loginSuccess"
  - set:
      field: event.outcome
      value: failure
      when:
        equals:
          raw.protoPayload.methodName: "google.login.LoginService.loginFailure"

  # 2. Service Account Impersonation & Token Minting
  - set:
      field: event.category
      value: [authentication, iam]
      when:
        equals:
          raw.protoPayload.serviceName: "iamcredentials.googleapis.com"
  - set:
      field: event.type
      value: [access, token]
      when:
        equals:
          raw.protoPayload.serviceName: "iamcredentials.googleapis.com"

  # 3. Workload Identity STS Token Exchange
  - set:
      field: event.category
      value: [authentication, iam]
      when:
        equals:
          raw.protoPayload.serviceName: "sts.googleapis.com"
  - set:
      field: event.type
      value: [access, token]
      when:
        equals:
          raw.protoPayload.serviceName: "sts.googleapis.com"

  # 4. Service Account Key Creation / Deletion
  - set:
      field: event.category
      value: [iam, configuration]
      when:
        or:
          - equals:
              raw.protoPayload.methodName: "google.iam.admin.v1.CreateServiceAccountKey"
          - equals:
              raw.protoPayload.methodName: "google.iam.admin.v1.DeleteServiceAccountKey"

  # Clean up temporary raw data
  - remove:
      field: raw
      ignore_missing: true
