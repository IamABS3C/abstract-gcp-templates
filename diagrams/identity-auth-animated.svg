<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" width="100%" height="auto" style="background:#060608; border-radius:12px; font-family:'Barlow',-apple-system,sans-serif;">
  <defs>
    <filter id="f-glow-id" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Banner -->
  <text x="40" y="44" fill="#FF216B" font-size="20" font-weight="700">Abstract Security — GCP Identity &amp; Authentication Auditing</text>
  <text x="40" y="68" fill="#8b93a7" font-size="12">OneUptime Auditing Principles · 5 Auth Streams · Zero Silent Failures · Synthetic Canary Probes</text>
  <line x1="40" y1="80" x2="350" y2="80" stroke="#FF216B" stroke-width="2"/>

  <!-- Paths -->
  <path d="M 260 140 H 420 V 300 H 480" fill="none" stroke="#2E9BF0" stroke-width="2.5" opacity="0.6"/>
  <path d="M 260 220 H 400 V 300 H 480" fill="none" stroke="#F5C61E" stroke-width="2.5" opacity="0.6"/>
  <path d="M 260 300 H 480" fill="none" stroke="#01e69d" stroke-width="2.5" opacity="0.6"/>
  <path d="M 260 380 H 400 V 300 H 480" fill="none" stroke="#FF216B" stroke-width="2.5" opacity="0.6"/>
  <path d="M 260 460 H 420 V 300 H 480" fill="none" stroke="#8b93a7" stroke-width="2.5" opacity="0.6"/>
  <path d="M 700 300 H 770" fill="none" stroke="#FF216B" stroke-width="3" opacity="0.7"/>
  <path d="M 970 300 H 1050" fill="none" stroke="#01e69d" stroke-width="3" opacity="0.7"/>

  <!-- Packets -->
  <circle r="4.5" fill="#2E9BF0" filter="url(#f-glow-id)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 140 H 420 V 300 H 480"/></circle>
  <circle r="4.5" fill="#F5C61E" filter="url(#f-glow-id)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 220 H 400 V 300 H 480"/></circle>
  <circle r="4.5" fill="#01e69d" filter="url(#f-glow-id)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 300 H 480"/></circle>
  <circle r="4.5" fill="#FF216B" filter="url(#f-glow-id)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 380 H 400 V 300 H 480"/></circle>
  <circle r="4.5" fill="#8b93a7" filter="url(#f-glow-id)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 460 H 420 V 300 H 480"/></circle>
  <circle r="5" fill="#FF216B" filter="url(#f-glow-id)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 700 300 H 770"/></circle>
  <circle r="5" fill="#01e69d" filter="url(#f-glow-id)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 970 300 H 1050"/></circle>

  <!-- 5 Auth Stream Nodes -->
  <rect x="40" y="110" width="220" height="60" rx="8" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="136" fill="#ECEFF1" font-size="13" font-weight="600">1. User Logins &amp; 2SV</text>
  <text x="56" y="154" fill="#8b93a7" font-size="11">login.googleapis.com (Native Sharing)</text>

  <rect x="40" y="190" width="220" height="60" rx="8" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="216" fill="#ECEFF1" font-size="13" font-weight="600">2. SA Impersonation</text>
  <text x="56" y="234" fill="#8b93a7" font-size="11">iamcredentials (Requires DATA_READ)</text>

  <rect x="40" y="270" width="220" height="60" rx="8" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="296" fill="#ECEFF1" font-size="13" font-weight="600">3. Workload Identity Fed</text>
  <text x="56" y="314" fill="#8b93a7" font-size="11">sts.googleapis.com (Requires DATA_READ)</text>

  <rect x="40" y="350" width="220" height="60" rx="8" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="376" fill="#ECEFF1" font-size="13" font-weight="600">4. Static SA Key Usage</text>
  <text x="56" y="394" fill="#8b93a7" font-size="11">serviceAccountKeyName tracking</text>

  <rect x="40" y="430" width="220" height="60" rx="8" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="456" fill="#ECEFF1" font-size="13" font-weight="600">5. IAM Policy Mutations</text>
  <text x="56" y="474" fill="#8b93a7" font-size="11">cloudaudit.../activity &amp; policy denials</text>

  <!-- Log Router -->
  <rect x="480" y="235" width="220" height="130" rx="10" fill="#0d1322" stroke="#2E9BF0" stroke-width="2"/>
  <text x="500" y="268" fill="#2E9BF0" font-size="14" font-weight="700">Cloud Log Router</text>
  <text x="500" y="290" fill="#ECEFF1" font-size="12">Aggregated Org Sink</text>
  <text x="500" y="312" fill="#8b93a7" font-size="11">Data Access + Admin Activity</text>
  <text x="500" y="332" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">roles/pubsub.publisher bound</text>

  <!-- Pub/Sub & Canaries -->
  <rect x="770" y="235" width="200" height="130" rx="10" fill="#0d1322" stroke="#FF216B" stroke-width="2"/>
  <text x="788" y="268" fill="#FF216B" font-size="14" font-weight="700">Cloud Pub/Sub</text>
  <text x="788" y="290" fill="#ECEFF1" font-size="12">abstract-audit-logs</text>
  <text x="788" y="312" fill="#F5C61E" font-size="11">OneUptime Canary Prober</text>
  <text x="788" y="332" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">Dead-Man Alert: &gt;30m silence</text>

  <!-- Abstract Platform -->
  <rect x="1050" y="215" width="260" height="170" rx="12" fill="#0d1322" stroke="#01e69d" stroke-width="2"/>
  <text x="1072" y="252" fill="#01e69d" font-size="15" font-weight="700">Abstract Security</text>
  <text x="1072" y="276" fill="#ECEFF1" font-size="13">Identity Threat Analytics</text>
  <text x="1072" y="300" fill="#8b93a7" font-size="11">Brute-Force &amp; Spray Detection</text>
  <text x="1072" y="320" fill="#8b93a7" font-size="11">Impersonation Chain Tracking</text>
  <text x="1072" y="340" fill="#8b93a7" font-size="11">managed GCP Pub/Sub parser</text>
  <text x="1072" y="362" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">BigQuery Security Lake Sync</text>

  <!-- Legend -->
  <g transform="translate(40, 525)">
    <rect width="1270" height="55" rx="8" fill="#090b10" stroke="#1f2430" stroke-width="1"/>
    <text x="20" y="32" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="11">ONEUPTIME ARCHITECTURE: Full credential attribution, multi-hop impersonation lineage, and synthetic canaries ensure zero blind spots.</text>
  </g>
</svg>