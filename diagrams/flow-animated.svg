<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="GCP organization log flow: every project routes through the Log Router to a Pub/Sub topic in a dedicated logging project, which Abstract pulls from.">
  <title>GCP org-wide log flow into Abstract Security</title>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF216B"/><stop offset="100%" stop-color="#C2004C"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M232,138 H384 Q420,138 420,174 V196"/>
    <path id="p2" d="M232,210 H420"/>
    <path id="p3" d="M232,318 H384 Q420,318 420,282 V224"/>
    <path id="p4" d="M520,210 H700"/>
    <path id="p5" d="M828,210 H980"/>
