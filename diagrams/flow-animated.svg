  </defs>

  <rect width="1200" height="440" fill="#060608"/>

  <!-- containers -->
  <rect x="24" y="46" width="536" height="330" rx="14" fill="none" stroke="#2e9bf0" stroke-width="1.5" opacity=".55"/>
  <text class="lbl h" x="44" y="76" fill="#2e9bf0">GCP Organization</text>
  <text class="lbl s" x="44" y="94">every project — today and every one created later</text>

  <rect x="596" y="120" width="292" height="180" rx="14" fill="none" stroke="#01e69d" stroke-width="1.5" opacity=".55"/>
  <text class="lbl h" x="616" y="150" fill="#01e69d">Dedicated logging project</text>
  <text class="lbl s" x="616" y="168">not a workload project</text>

  <rect x="944" y="46" width="232" height="330" rx="14" fill="none" stroke="#FF216B" stroke-width="1.5" opacity=".7"/>
  <text class="lbl h" x="964" y="76" fill="#FF216B">Abstract Security</text>

  <!-- wires -->
  <use href="#p1" class="wire"/><use href="#p2" class="wire"/><use href="#p3" class="wire"/>
  <use href="#p4" class="wire"/><use href="#p5" class="wire"/>

  <!-- sources -->
  <g class="lbl">
    <rect class="box" x="60" y="114" width="172" height="48"/>
    <text x="76" y="135" fill="#e9ecf1" font-size="13.5">Project A</text>
    <text x="76" y="152" class="s">IAM · GKE · BigQuery</text>

    <rect class="box" x="60" y="186" width="172" height="48"/>
    <text x="76" y="207" fill="#e9ecf1" font-size="13.5">Project B</text>
    <text x="76" y="224" class="s">firewall · DNS · Cloud SQL</text>

    <rect class="box" x="60" y="294" width="172" height="48"/>
    <text x="76" y="315" fill="#01e69d" font-size="13.5">Project Z</text>
    <text x="76" y="332" class="s">created next year</text>
  </g>

  <!-- log router -->
  <g class="lbl">
    <rect class="box" x="420" y="182" width="100" height="56" stroke="#2e9bf0"/>
    <text x="470" y="206" text-anchor="middle" fill="#e9ecf1" font-size="13">Log Router</text>
    <text x="470" y="223" text-anchor="middle" class="s">aggregated sink</text>
  </g>

  <!-- topic + sub -->
  <g class="lbl">
    <rect class="box" x="700" y="182" width="128" height="56" stroke="#01e69d"/>
    <text x="764" y="206" text-anchor="middle" fill="#e9ecf1" font-size="13">Pub/Sub topic</text>
    <text x="764" y="223" text-anchor="middle" class="s">7-day retention</text>

    <rect class="box" x="980" y="182" width="156" height="56" stroke="#FF216B"/>
    <text x="1070" y="206" text-anchor="middle" fill="#e9ecf1" font-size="13">Pull subscription</text>
    <text x="1070" y="223" text-anchor="middle" class="s">expiration: never</text>
    <use href="#mark" x="1052" y="292" width="52" height="46"/>
    <text x="1078" y="360" text-anchor="middle" fill="#FF216B" font-size="12.5" font-weight="600">Abstract Security</text>
    <text x="1078" y="376" text-anchor="middle" class="s">normalised to ACS</text>
  </g>

  <!-- the two facts that break this -->
  <text class="lbl k" x="700" y="266" text-anchor="middle">writer identity needs</text>
  <text class="lbl k" x="700" y="281" text-anchor="middle">roles/pubsub.publisher</text>
  <text class="lbl k" x="24" y="400" fill="#8b8f98">--include-children  ·  scope is CONTAINMENT, not a project list</text>

  <!-- animated packets -->
  <g class="pk" fill="url(#pink)" filter="url(#glow)">
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="2.0s"><mpath href="#p3"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.7s" repeatCount="indefinite" begin="0.7s"><mpath href="#p4"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.7s" repeatCount="indefinite" begin="1.5s"><mpath href="#p5"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.7s" repeatCount="indefinite" begin="2.4s"><mpath href="#p5"/></animateMotion></circle>
  </g>
</svg>
