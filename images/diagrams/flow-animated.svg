<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="100%" height="auto" style="background:#060608; border-radius:12px; font-family:'Barlow',-apple-system,sans-serif;">
  <defs>
    <linearGradient id="flow-abm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF216B"/>
      <stop offset="100%" stop-color="#C2004C"/>
    </linearGradient>
    <linearGradient id="flow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01e69d"/>
      <stop offset="100%" stop-color="#008445"/>
    </linearGradient>
    <linearGradient id="flow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9BF0"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Banner -->
  <text x="40" y="44" fill="#FF216B" font-size="20" font-weight="700" letter-spacing="0.5">Abstract Security — GCP Audit Log Streaming Pipeline</text>
  <text x="40" y="68" fill="#8b93a7" font-size="12">Real-time control plane &amp; identity telemetry flow · Zero silent failures · Enterprise architecture</text>
  <line x1="40" y1="80" x2="300" y2="80" stroke="#FF216B" stroke-width="2"/>

  <!-- Live Pulse Badge -->
  <g transform="translate(1080, 36)">
    <rect width="160" height="28" rx="14" fill="#0b0d13" stroke="#01e69d" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#01e69d">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">PIPELINE ACTIVE</text>
  </g>

  <!-- Flow Paths -->
  <path id="p1" d="M 230 180 H 380 V 270 H 450" fill="none" stroke="#2E9BF0" stroke-width="2.5" opacity="0.6"/>
  <path id="p2" d="M 230 270 H 450" fill="none" stroke="#01e69d" stroke-width="2.5" opacity="0.6"/>
  <path id="p3" d="M 230 360 H 380 V 270 H 450" fill="none" stroke="#F5C61E" stroke-width="2.5" opacity="0.6"/>
  <path id="p4" d="M 640 270 H 740" fill="none" stroke="#FF216B" stroke-width="3" opacity="0.7"/>
  <path id="p5" d="M 910 270 H 1020" fill="none" stroke="#01e69d" stroke-width="3" opacity="0.7"/>

  <!-- Flow Packets -->
  <circle r="4.5" fill="#2E9BF0" filter="url(#f-glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 180 H 380 V 270 H 450"/></circle>
  <circle r="4.5" fill="#01e69d" filter="url(#f-glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 270 H 450"/></circle>
  <circle r="4.5" fill="#F5C61E" filter="url(#f-glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 360 H 380 V 270 H 450"/></circle>
  <circle r="5" fill="#FF216B" filter="url(#f-glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 640 270 H 740"/></circle>
  <circle r="5" fill="#01e69d" filter="url(#f-glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 910 270 H 1020"/></circle>

  <!-- Nodes -->
  <!-- Source 1 -->
  <rect x="40" y="145" width="190" height="70" rx="10" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="174" fill="#ECEFF1" font-size="13" font-weight="600">Admin Activity</text>
  <text x="56" y="194" fill="#8b93a7" font-size="11">IAM, Policies, GKE</text>

  <!-- Source 2 -->
  <rect x="40" y="235" width="190" height="70" rx="10" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="264" fill="#ECEFF1" font-size="13" font-weight="600">Data Access</text>
  <text x="56" y="284" fill="#8b93a7" font-size="11">BigQuery, Storage, KMS</text>

  <!-- Source 3 -->
  <rect x="40" y="325" width="190" height="70" rx="10" fill="#0d1322" stroke="#2b3752" stroke-width="1.5"/>
  <text x="56" y="354" fill="#ECEFF1" font-size="13" font-weight="600">Identity &amp; Auth</text>
  <text x="56" y="374" fill="#8b93a7" font-size="11">Workspace, SA, WIF</text>

  <!-- Log Router -->
  <rect x="450" y="215" width="190" height="110" rx="10" fill="#0d1322" stroke="#2E9BF0" stroke-width="2"/>
  <text x="470" y="248" fill="#2E9BF0" font-size="14" font-weight="700">Cloud Log Router</text>
  <text x="470" y="270" fill="#ECEFF1" font-size="12">Aggregated Org Sink</text>
  <text x="470" y="292" fill="#8b93a7" font-size="11">--include-children</text>
  <text x="470" y="310" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">Writer Identity Grant</text>

  <!-- Pub/Sub Topic & Sub -->
  <rect x="740" y="215" width="170" height="110" rx="10" fill="#0d1322" stroke="#FF216B" stroke-width="2"/>
  <text x="758" y="248" fill="#FF216B" font-size="14" font-weight="700">Cloud Pub/Sub</text>
  <text x="758" y="270" fill="#ECEFF1" font-size="12">abstract-audit-logs</text>
  <text x="758" y="292" fill="#8b93a7" font-size="11">7-Day Retention</text>
  <text x="758" y="310" fill="#F5C61E" font-family="'JetBrains Mono',monospace" font-size="10">Pull: abstract-...-sub</text>

  <!-- Abstract Platform -->
  <rect x="1020" y="200" width="220" height="140" rx="12" fill="#0d1322" stroke="#01e69d" stroke-width="2"/>
  <text x="1042" y="238" fill="#01e69d" font-size="15" font-weight="700">Abstract Security</text>
  <text x="1042" y="262" fill="#ECEFF1" font-size="13">SIEM &amp; Detection Engine</text>
  <text x="1042" y="286" fill="#8b93a7" font-size="11">Automated Normalization</text>
  <text x="1042" y="306" fill="#8b93a7" font-size="11">Real-Time Threat Detection</text>
  <text x="1042" y="326" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">Latency: &lt; 5 seconds</text>

  <!-- Legend / Flow Keymap -->
  <g transform="translate(40, 440)">
    <rect width="1200" height="60" rx="8" fill="#090b10" stroke="#1f2430" stroke-width="1"/>
    <text x="20" y="25" fill="#8b93a7" font-size="11" font-weight="700">FLOW KEYMAP &amp; ARCHITECTURAL GUARANTEES:</text>
    <circle cx="280" cy="22" r="5" fill="#2E9BF0"/>
    <text x="295" y="26" fill="#ECEFF1" font-size="11">Admin Activity (Free Tier)</text>
    <circle cx="480" cy="22" r="5" fill="#01e69d"/>
    <text x="495" y="26" fill="#ECEFF1" font-size="11">Data Access (Two-Switch)</text>
    <circle cx="680" cy="22" r="5" fill="#F5C61E"/>
    <text x="695" y="26" fill="#ECEFF1" font-size="11">Identity Streams</text>
    <circle cx="850" cy="22" r="5" fill="#FF216B"/>
    <text x="865" y="26" fill="#ECEFF1" font-size="11">Pub/Sub Transport</text>
    <text x="20" y="48" fill="#01e69d" font-family="'JetBrains Mono',monospace" font-size="10">CRITICAL: writer_identity holds roles/pubsub.publisher · Reader SA holds roles/pubsub.subscriber ONLY · Grid: OFF</text>
  </g>
</svg>